
name: Build Seamless APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Android SDK: $SDK"

          if [ ! -d "$SDK/platforms/android-35" ]; then
            echo "Android SDK platform 35 is missing."
            exit 1
          fi

          if [ ! -d "$SDK/build-tools/35.0.0" ]; then
            echo "Android build-tools 35.0.0 are missing."
            exit 1
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Seamless APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload Seamless APK
        uses: actions/upload-artifact@v4
        with:
          name: Seamless-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
